name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk RemoveReels.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RemoveReels-apk
          path: RemoveReels.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Remove Reels (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            On your phone, download **RemoveReels.apk** below and open it to install.
            See the README for setup steps.
          files: RemoveReels.apk
